name: Build Yabiso APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Yabiso SERVICES" com.yabiso.services --web-dir=www
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yabiso SERVICES</title><style>body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;color:white}h1{color:#ffcc00}</style></head><body><h1>Yabiso SERVICES</h1><p>Kinshasa - Votre service tout en un</p><p>APK genere avec succes!</p></body></html>' > www/index.html
          npx cap add android
                    cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yabiso-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
