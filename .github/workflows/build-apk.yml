name: Build Yabiso APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Yabiso SERVICES" com.yabiso.services --web-dir=www
          mkdir -p www
          echo "<h1>Yabiso SERVICES - Kinshasa</h1>" > www/index.html
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yabiso-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
